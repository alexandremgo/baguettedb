# Builds the bdb command line for the given version and attaches it to a draft release: one archive per platform,
# built on a runner of that platform, with a checksums file. A draft is visible to maintainers only and has no tag yet,
# so its archives can be tested as users will download them; publishing it creates the tag on the commit they were
# built from, and the published archives are the tested ones.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as v1.2.3 or v1.2.3-rc1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: "Check the version"
    runs-on: ubuntu-latest
    steps:
      # A published release owns its tag, so a version whose tag exists is taken; a draft of it may be rebuilt.
      - name: Check the format and that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "the version must look like v1.2.3 or v1.2.3-rc1, not ${VERSION}" >&2
            exit 1
          fi
          existing="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}")"
          if [ -n "$existing" ]; then
            echo "the tag ${VERSION} already exists" >&2
            exit 1
          fi

  binaries:
    name: "bdb CLI: build ${{ matrix.os }}/${{ matrix.arch }}"
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # The last Intel macOS image, supported until about August 2027.
          - os: darwin
            arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The macOS build runs on the runner itself; the Linux one in a container that brings its own Go.
      - uses: actions/setup-go@v6
        if: matrix.os == 'darwin'
        with:
          go-version-file: go.mod

      - name: Build the web app into pkg/webui
        run: |
          npm ci --prefix web
          make web-build webui-sync

      - name: Build bdb
        run: scripts/build-cli-release.sh "$VERSION"

      # bdb and a baguettedb link to it, the same command under either name, with the license notices.
      - name: Package the archive
        id: archive
        run: |
          name="bdb_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp dist/bdb LICENSE.md THIRD_PARTY_LICENSES "dist/${name}/"
          ln -s bdb "dist/${name}/baguettedb"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "file=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # Runs both names from the archive, and has the binary create, write and read a bdb in a fresh data directory.
      - name: Smoke-test the archive
        run: |
          check="$(mktemp -d)"
          tar -C "$check" -xzf "${{ steps.archive.outputs.file }}"
          cd "$check"/bdb_*
          ./bdb version
          ./baguettedb version
          ./bdb --data-dir "$check/data" bdbs create --starter kanban
          ./bdb --data-dir "$check/data" sql data Kanban "INSERT INTO tasks (name, position) VALUES ('smoke', 1)"
          ./bdb --data-dir "$check/data" sql query Kanban "SELECT name FROM tasks" | grep -q smoke

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: bdb-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: "bdb CLI: attach to the draft release"
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bdb-*
          merge-multiple: true

      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt

      # The first run for a version creates the draft, as a pre-release for a version with a pre-release part
      # (v1.2.3-rc1). A later run keeps the draft and its notes, which may have been edited by hand, and points it at
      # the commit it built before replacing the archives.
      - name: Attach to the draft release
        working-directory: dist
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --target "$GITHUB_SHA"
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes \
              "${prerelease[@]}"
          fi
          gh release upload "$VERSION" ./*.tar.gz checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
